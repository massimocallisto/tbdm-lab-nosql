name: tbdm-iot-nosql

services:
  broker-init:
    image: eclipse-mosquitto:2
    profiles: [setup]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        mosquitto_passwd -b -c /mosquitto/config/passwords "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chmod 0644 /mosquitto/config/passwords
    volumes:
      - ./mosquitto:/mosquitto/config

  broker:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mqtt_data2:/mosquitto/data

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data2:/data

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data2:/data/db

  arango:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:?Set ARANGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:8529:8529"
    volumes:
      - arango_data2:/var/lib/arangodb3

volumes:
  mqtt_data2:
  redis_data2:
  mongo_data2:
  arango_data2:
